{{define "settings"}}

<div id="advanced-settings" class="flex fixed inset-0 items-center justify-center hidden" >
  <div onclick="document.getElementById('advanced-settings').classList.toggle('hidden');return false" class="fixed inset-0 bg-gray-900 opacity-50"></div>

  <div class="bg-white p-4 mx-4 md:px-6 rounded-md shadow relative max-h-[90vh] overflow-y-scroll w-[500px]">
    <h2 class="mb-4 font-semibold text-xl font-headline dark:text-white">
      Advanced Connection Settings
    </h2>
    {{ if .Disabled }}
      <p class="rounded-md text-blue-700 bg-blue-50 p-3 mb-4">
        💡 This app connection has preconfigured settings and cannot be edited.
      </p>
    {{ end }}
    
    <div {{ if .Disabled }}class="opacity-60 pointer-events-none"{{ end }}>
      <div class="mb-6">
        <label
          for="expires-at-popup"
          class="block mb-2 font-medium text-gray-800 dark:text-gray-300"
        >
          Connection expiry date
        </label>
        <input
          {{if .Disabled}}tabIndex="-1"{{end}}
          type="date"
          value="{{.ExpiresAt}}"
          id="expires-at-popup"
          autocomplete="off"
          min=""
          class="bg-gray-50 border border-gray-300 text-gray-900 focus:ring-purple-700 dark:focus:ring-purple-600 dark:ring-offset-gray-800 focus:ring-2 text-sm rounded-lg block w-full p-2.5 dark:bg-surface-00dp dark:border-gray-700 dark:placeholder-gray-400 dark:text-white dark:[color-scheme:dark]"
        >
      </div>

      <div class="mb-6">
        <h3 class="font-semibold text-lg mb-4 text-gray-800 dark:text-white">
          Permissions for the connected app
        </h3>
        <input type="hidden" id="request-methods-popup" value={{if .RequestMethods}}{{.RequestMethods}}{{else}}{{"pay_invoice"}}{{end}}>
        <div id="request-method-options">
          <ul class="items-center w-full">
            {{range $key, $value := .RequestMethodHelper}}
              <li class="w-full mb-2">
                <label class="w-full relative inline-flex items-center justify-between cursor-pointer">
                  <span class="text-sm text-gray-800 dark:text-gray-300">
                    {{$value.Description}}
                  </span>
                  <input {{if $value.Checked }} checked {{end}} id="{{$key}}-id" type="checkbox" value="{{ $key }}" class="sr-only peer">
                  <div class="shrink-0 w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:mt-0.5 after:ml-0.5 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-purple-700"></div>
                </label>
              </li>
            {{ end }}
          </ul>
        </div>
      </div>

      <p class="text-gray-500 dark:text-gray-400 flex items-center mb-4 {{if not .RequestMethodHelper.pay_invoice.Checked}}hidden{{end}}" id="budget-checkbox-wrapper-popup">
        <input {{if .Disabled}}tabIndex="-1"{{end}} {{if .BudgetEnabled}}checked{{end}} id="budget-checkbox-popup" type="checkbox" class="w-4 h-4 text-purple-700 bg-gray-50 border border-gray-300 rounded focus:ring-purple-700 dark:focus:ring-purple-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-surface-00dp dark:border-gray-700">
        <label for="budget-checkbox-popup" class="ml-2 font-medium text-gray-800 dark:text-gray-300">Payments budget allowance</label>
      </p>
      <div class="{{if not .BudgetEnabled}}opacity-30{{end}} {{if not .RequestMethodHelper.pay_invoice.Checked}}hidden{{end}}" id="budget-options-popup">
        <div class="mt-4">
          <label for="max-amount-popup" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Budget Amount (in sats)
          </label>
          <input {{if .Disabled}}tabIndex="-1"{{end}} disabled type="number" id="max-amount-popup" aria-describedby="helper-text-explanation" class="bg-gray-50 border border-gray-300 text-gray-900 focus:ring-purple-700 dark:focus:ring-purple-600 dark:ring-offset-gray-800 focus:ring-2 text-sm rounded-lg block w-full p-2.5 dark:bg-surface-00dp dark:border-gray-700 dark:placeholder-gray-400 dark:text-white" pattern="{0-9}.*" value={{.MaxAmount}}>
        </div>
        <div class="mt-4">
          <p class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Budget Renewal
          </p>
          <ul class="items-center w-full grid grid-cols-3 md:grid-cols-5 gap-x-8 gap-y-4">
            <li class="w-full">
              <div class="flex items-center">
                <input {{if .Disabled}}tabIndex="-1"{{end}} {{ if or (eq .BudgetRenewal "") (eq .BudgetRenewal "never") }}checked{{end}} disabled name="BudgetRenewal" id="BudgetRenewalNever" type="radio" value="never" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-700 dark:focus:ring-offset-gray-700 focus:ring-2 dark:bg-gray-600 dark:border-gray-500">
                <label for="BudgetRenewalNever" class="w-full ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Never</label>
              </div>
            </li>
            <li class="w-full">
              <div class="flex items-center">
                <input {{if .Disabled}}tabIndex="-1"{{end}} disabled {{ if eq .BudgetRenewal "daily" }}checked{{end}} name="BudgetRenewal" id="BudgetRenewalDaily" type="radio" value="daily" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-700 dark:focus:ring-offset-gray-700 focus:ring-2 dark:bg-gray-600 dark:border-gray-500">
                <label for="BudgetRenewalDaily" class="w-full ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Daily</label>
              </div>
            </li>
            <li class="w-full">
              <div class="flex items-center">
                <input {{if .Disabled}}tabIndex="-1"{{end}} disabled {{ if eq .BudgetRenewal "weekly" }}checked{{end}} name="BudgetRenewal" id="BudgetRenewalWeekly" type="radio" value="weekly" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-700 dark:focus:ring-offset-gray-700 focus:ring-2 dark:bg-gray-600 dark:border-gray-500">
                <label for="BudgetRenewalWeekly" class="w-full ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Weekly</label>
              </div>
            </li>
            <li class="w-full">
              <div class="flex items-center">
                <input {{if .Disabled}}tabIndex="-1"{{end}} disabled {{ if eq .BudgetRenewal "monthly" }}checked{{end}} name="BudgetRenewal" id="BudgetRenewalMonthly" type="radio" value="monthly" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-700 dark:focus:ring-offset-gray-700 focus:ring-2 dark:bg-gray-600 dark:border-gray-500">
                <label for="BudgetRenewalMonthly" class="w-full ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Monthly</label>
              </div>
            </li>
            <li class="w-full">
              <div class="flex items-center">
                <input {{if .Disabled}}tabIndex="-1"{{end}} disabled {{ if eq .BudgetRenewal "yearly" }}checked{{end}} name="BudgetRenewal" id="BudgetRenewalYearly" type="radio" value="yearly" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-700 dark:focus:ring-offset-gray-700 focus:ring-2 dark:bg-gray-600 dark:border-gray-500">
                <label for="BudgetRenewalYearly" class="w-full ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Yearly</label>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="flex justify-between items-center gap-4 mt-6">
      <button
        onclick="document.getElementById('advanced-settings').classList.toggle('hidden');return false"
        class="inline-flex w-full bg-white border cursor-pointer dark:bg-surface-02dp dark:border-white/10 dark:hover:bg-surface-16dp duration-150 focus-visible:ring-2 focus-visible:ring-offset-2 focus:outline-none font-medium hover:bg-gray-50 items-center justify-center px-5 py-3 rounded-md shadow text-gray-700 dark:text-neutral-300 transition"
      >
        Cancel
      </button>
      <button
        id="save-settings"
        class="inline-flex w-full bg-purple-700 cursor-pointer dark:text-neutral-200 duration-150 focus-visible:ring-2 focus-visible:ring-offset-2 focus:outline-none font-medium hover:bg-purple-900 items-center justify-center px-5 py-3 rounded-md shadow text-white transition"
      >
        Save
      </button>
    </div>
  </div>
</div>
{{end}}
